name: Sync warikan seisan card

on:
  push:
    branches: [main]
    paths:
      - 'apps/warikan-seisan/**'
      - 'scripts/sync_warikan_seisan_card.py'
      - '.github/workflows/sync-warikan-seisan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/sync_warikan_seisan_card.py
      - name: Commit home card
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "立替精算をホームに追加"
          git push
