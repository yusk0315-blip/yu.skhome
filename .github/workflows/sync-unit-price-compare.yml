name: Sync unit price compare card
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_unit_price_compare_card.py'
      - '.github/workflows/sync-unit-price-compare.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/sync_unit_price_compare_card.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m 'どっちがお得？単価比較をホームに追加'
          git push
