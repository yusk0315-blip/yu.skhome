name: Sync tilt level card
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_tilt_level_card.py'
      - '.github/workflows/sync-tilt-level.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/sync_tilt_level_card.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m '傾斜角メーターをホームに追加'
          git push
