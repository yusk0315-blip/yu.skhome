name: Sync image resizer card

on:
  push:
    branches: [main]
    paths:
      - 'apps/image-resizer/**'
      - 'scripts/sync_image_resizer_card.py'
      - '.github/workflows/sync-image-resizer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/sync_image_resizer_card.py
      - name: Commit home card
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "画像リサイズ＆圧縮をホームに追加"
          git push
