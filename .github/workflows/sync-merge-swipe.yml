name: Sync Merge Swipe homepage card

on:
  push:
    branches: [main]
    paths:
      - 'apps/merge-swipe/**'
      - 'scripts/sync_merge_swipe_card.py'
      - '.github/workflows/sync-merge-swipe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add homepage card
        run: python scripts/sync_merge_swipe_card.py
      - name: Commit homepage update
        run: |
          if git diff --quiet; then
            echo "No homepage changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add Merge Swipe to homepage"
          git push
