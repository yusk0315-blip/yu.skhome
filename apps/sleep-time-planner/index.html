<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#25324a">
  <title>睡眠時刻プランナー｜ゆーすけ無料アプリ集</title>
  <meta name="description" content="起きたい時刻・寝たい時刻から睡眠時間の候補をすぐ確認できる無料ミニアプリ。登録不要・通信不要です。">
  <style>
    :root{--bg:#eef2f7;--card:#fff;--text:#172033;--muted:#687387;--line:rgba(23,32,51,.12);--main:#25324a;--accent:#6a7da6;--good:#287861;--shadow:0 18px 50px rgba(37,50,74,.10)}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;color:var(--text);background:radial-gradient(circle at 100% 0%,rgba(106,125,166,.18),transparent 28rem),linear-gradient(180deg,#f7f9fc,var(--bg));min-height:100vh}
    button,input,select{font:inherit}.wrap{width:min(720px,100%);margin:auto;padding:18px 16px 72px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.home{text-decoration:none;color:var(--main);font-weight:850}.badge{font-size:12px;color:var(--main);background:rgba(106,125,166,.12);padding:7px 10px;border-radius:999px;font-weight:800}
    .hero,.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero{padding:24px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:900}.hero h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(30px,8vw,44px);line-height:1.18;margin:10px 0}.hero p{margin:0;color:var(--muted);line-height:1.8}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:14px;padding:12px;font-weight:850}.tab.active{background:var(--main);color:#fff;border-color:var(--main)}
    .panel{padding:18px;margin-top:14px}.label{display:block;font-size:13px;color:var(--muted);font-weight:800;margin-bottom:7px}.timeRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.time{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff;color:var(--text);font-size:24px;font-weight:850;min-height:58px}.primary{border:0;border-radius:16px;background:var(--main);color:#fff;padding:15px 18px;font-weight:900;min-height:58px}.hint{font-size:12px;color:var(--muted);line-height:1.7;margin:10px 0 0}
    .results{display:grid;gap:10px;margin-top:14px}.result{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.moon{width:42px;height:42px;border-radius:14px;background:rgba(106,125,166,.12);display:grid;place-items:center;font-size:21px}.result strong{font-size:22px}.result small{display:block;color:var(--muted);margin-top:3px}.hours{font-weight:900;color:var(--good);white-space:nowrap}.recommended{border-color:rgba(40,120,97,.35);box-shadow:inset 0 0 0 1px rgba(40,120,97,.08)}
    .settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.field select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.note{margin-top:14px;padding:13px 14px;border-radius:16px;background:rgba(106,125,166,.08);color:var(--muted);font-size:12px;line-height:1.75}.empty{text-align:center;color:var(--muted);padding:20px 10px}
    @media(max-width:520px){.wrap{padding-inline:12px}.hero{padding:20px}.panel{padding:14px}.timeRow{grid-template-columns:1fr}.primary{width:100%}.settings{grid-template-columns:1fr}.result{grid-template-columns:auto 1fr}.hours{grid-column:2}.result strong{font-size:20px}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top"><a class="home" href="../../">← ホームへ戻る</a><span class="badge">通信不要</span></div>
  <section class="hero">
    <div class="eyebrow">SLEEP TIME PLANNER</div>
    <h1>睡眠時刻<br>プランナー</h1>
    <p>起きたい時刻、または寝たい時刻を入れるだけ。確保できる睡眠時間ごとの候補時刻をまとめて表示します。</p>
    <div class="tabs" role="tablist">
      <button class="tab active" id="wakeTab" type="button">起きる時刻から逆算</button>
      <button class="tab" id="bedTab" type="button">寝る時刻から計算</button>
    </div>
  </section>

  <section class="panel">
    <label class="label" id="timeLabel" for="baseTime">起きたい時刻</label>
    <div class="timeRow">
      <input class="time" id="baseTime" type="time" value="07:00">
      <button class="primary" id="calcBtn" type="button">候補を見る</button>
    </div>
    <div class="settings">
      <label class="field"><span class="label">寝付くまでの目安</span><select id="fallAsleep"><option value="0">0分</option><option value="10">10分</option><option value="15" selected>15分</option><option value="20">20分</option><option value="30">30分</option></select></label>
      <label class="field"><span class="label">表示する睡眠時間</span><select id="range"><option value="short">6〜8時間</option><option value="normal" selected>7〜9時間</option><option value="wide">6〜10時間</option></select></label>
    </div>
    <p class="hint">時刻は端末内だけで計算します。入力内容はサーバーへ送信されません。</p>
  </section>

  <section class="panel">
    <span class="label">時刻の候補</span>
    <div class="results" id="results"></div>
    <div class="note">これは生活の目安を作るための計算ツールです。必要な睡眠時間には個人差があります。強い眠気や睡眠の悩みが続く場合は、計算結果より体調を優先してください。</div>
  </section>
</main>
<script>
const baseTime=document.getElementById('baseTime');
const results=document.getElementById('results');
const timeLabel=document.getElementById('timeLabel');
const wakeTab=document.getElementById('wakeTab');
const bedTab=document.getElementById('bedTab');
const fallAsleep=document.getElementById('fallAsleep');
const range=document.getElementById('range');
let mode='wake';

function minsFromTime(value){const [h,m]=value.split(':').map(Number);return h*60+m}
function fmt(total){total=((total%1440)+1440)%1440;const h=Math.floor(total/60),m=total%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function hoursForRange(){if(range.value==='short')return [6,6.5,7,7.5,8];if(range.value==='wide')return [6,6.5,7,7.5,8,8.5,9,9.5,10];return [7,7.5,8,8.5,9]}
function labelHours(h){return Number.isInteger(h)?`${h}時間`:`${Math.floor(h)}時間30分`}
function calc(){
  if(!baseTime.value){results.innerHTML='<div class="empty">時刻を入力してください。</div>';return}
  const base=minsFromTime(baseTime.value),fall=Number(fallAsleep.value);
  results.innerHTML='';
  hoursForRange().forEach(h=>{
    const sleepMins=Math.round(h*60);
    const target=mode==='wake'?base-sleepMins-fall:base+fall+sleepMins;
    const row=document.createElement('div');
    const isRec=h>=7&&h<=9;
    row.className='result'+(isRec?' recommended':'');
    row.innerHTML=`<span class="moon">${mode==='wake'?'🌙':'⏰'}</span><div><strong>${fmt(target)}</strong><small>${mode==='wake'?'この時刻までに布団へ':'この時刻に起床'}</small></div><span class="hours">${labelHours(h)}</span>`;
    results.appendChild(row);
  });
  localStorage.setItem('sleep-planner-v1',JSON.stringify({mode,time:baseTime.value,fall:fallAsleep.value,range:range.value}));
}
function setMode(next){mode=next;wakeTab.classList.toggle('active',mode==='wake');bedTab.classList.toggle('active',mode==='bed');timeLabel.textContent=mode==='wake'?'起きたい時刻':'寝たい時刻';calc()}
wakeTab.addEventListener('click',()=>setMode('wake'));bedTab.addEventListener('click',()=>setMode('bed'));document.getElementById('calcBtn').addEventListener('click',calc);baseTime.addEventListener('change',calc);fallAsleep.addEventListener('change',calc);range.addEventListener('change',calc);
try{const saved=JSON.parse(localStorage.getItem('sleep-planner-v1'));if(saved){baseTime.value=saved.time||'07:00';fallAsleep.value=saved.fall||'15';range.value=saved.range||'normal';setMode(saved.mode||'wake')}else calc()}catch{calc()}
</script>
</body>
</html>
