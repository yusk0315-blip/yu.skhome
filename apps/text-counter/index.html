<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>文字数・読む時間カウンター</title>
<meta name="description" content="文章の文字数、行数、段落数、読む時間と話す時間の目安をすぐ確認できる無料ツール。">
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe5ee;--accent:#3157d5;--soft:#edf1ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--text);background:linear-gradient(160deg,#eef2ff,var(--bg));min-height:100vh}.wrap{max-width:760px;margin:auto;padding:18px 14px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}a{color:var(--accent);font-weight:700;text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 14px 38px rgba(31,50,91,.08)}h1{font-size:clamp(24px,7vw,34px);margin:0 0 8px}.lead{margin:0 0 16px;color:var(--muted);line-height:1.7}textarea{width:100%;min-height:260px;resize:vertical;border:1px solid var(--line);border-radius:16px;padding:15px;font:16px/1.75 inherit;color:var(--text);background:#fbfcff}textarea:focus{outline:3px solid rgba(49,87,213,.15);border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.stat{background:var(--soft);border-radius:14px;padding:13px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{min-height:48px;border:0;border-radius:14px;font:700 15px inherit;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#eef1f5;color:var(--text)}.note{font-size:12px;color:var(--muted);line-height:1.6;margin:14px 2px 0}.toast{min-height:24px;text-align:center;color:var(--accent);font-weight:700;margin-top:8px}@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><main class="wrap"><header><a href="../../">← ホーム</a><span>登録・通信不要</span></header><section class="card"><h1>文字数・読む時間カウンター</h1><p class="lead">文章を貼るだけで、文字数・行数・段落数と、読む／話す時間の目安を表示します。</p><textarea id="text" placeholder="ここに文章を入力または貼り付け…" aria-label="計測する文章"></textarea><div class="stats"><div class="stat"><b id="chars">0</b><span>文字（空白込み）</span></div><div class="stat"><b id="charsNoSpace">0</b><span>文字（空白除外）</span></div><div class="stat"><b id="lines">0</b><span>行</span></div><div class="stat"><b id="paragraphs">0</b><span>段落</span></div><div class="stat"><b id="readTime">0秒</b><span>読む時間の目安</span></div><div class="stat"><b id="speakTime">0秒</b><span>話す時間の目安</span></div></div><div class="actions"><button class="primary" id="copy">文章をコピー</button><button class="secondary" id="clear">クリア</button></div><div class="toast" id="toast" aria-live="polite"></div><p class="note">目安は「読む：1分500文字」「話す：1分300文字」で計算。入力内容はこの端末に自動保存されます。</p></section></main><script>
const t=document.getElementById('text'),$=id=>document.getElementById(id),key='textCounterDraftV1';
function fmt(sec){if(!sec)return'0秒';const m=Math.floor(sec/60),s=Math.round(sec%60);return m?`${m}分${s?`${s}秒`:''}`:`${s}秒`}
function update(){const v=t.value,trim=v.trim(),noSpace=v.replace(/\s/g,'');$('chars').textContent=v.length.toLocaleString();$('charsNoSpace').textContent=noSpace.length.toLocaleString();$('lines').textContent=trim? v.split(/\r?\n/).length:0;$('paragraphs').textContent=trim?trim.split(/\n\s*\n/).filter(Boolean).length:0;$('readTime').textContent=fmt(noSpace.length/500*60);$('speakTime').textContent=fmt(noSpace.length/300*60);localStorage.setItem(key,v)}
t.value=localStorage.getItem(key)||'';update();t.addEventListener('input',update);$('copy').onclick=async()=>{if(!t.value)return show('文章がありません');try{await navigator.clipboard.writeText(t.value);show('コピーしました')}catch{t.select();document.execCommand('copy');show('コピーしました')}};$('clear').onclick=()=>{t.value='';update();t.focus();show('クリアしました')};let timer;function show(msg){$('toast').textContent=msg;clearTimeout(timer);timer=setTimeout(()=>$('toast').textContent='',1800)}
</script></body></html>
