<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>画像リサイズ＆圧縮｜ゆーすけ無料アプリ集</title>
<meta name="description" content="写真をブラウザ内で縮小・圧縮。幅や画質を調整してJPEGまたはPNGで保存できます。">
<style>
:root{--bg:#f5f3ed;--card:#fffefa;--text:#17211d;--muted:#68726c;--line:rgba(23,33,29,.14);--accent:#176b4d;--accent2:#d6923b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:linear-gradient(180deg,#f5f3ed,#eeebe3);color:var(--text);min-height:100vh}.wrap{max-width:720px;margin:auto;padding:18px 16px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.home{color:var(--accent);text-decoration:none;font-weight:800}.badge{font-size:12px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}h1{font-family:Georgia,"Yu Mincho",serif;font-size:30px;margin:6px 0 8px}.lead{color:var(--muted);line-height:1.7;margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 14px 36px rgba(23,33,29,.08);margin-top:14px}.drop{display:block;border:2px dashed rgba(23,107,77,.3);border-radius:18px;padding:26px 18px;text-align:center;background:rgba(23,107,77,.05);cursor:pointer;font-weight:800}.drop small{display:block;margin-top:6px;color:var(--muted);font-weight:500}.drop input{display:none}.preview{display:none;margin-top:14px}.preview img{width:100%;max-height:340px;object-fit:contain;border-radius:14px;background:#eee}.info{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{font-size:12px;background:#fff;border:1px solid var(--line);padding:6px 9px;border-radius:999px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-top:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:13px;padding:0 12px;background:#fff;font:inherit}.field input[type=range]{padding:0}.qualityRow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}button,.download{width:100%;min-height:52px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:900;font-size:16px;margin-top:16px;cursor:pointer}.download{display:none;text-decoration:none;text-align:center;padding:15px}.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.result{display:none}.result canvas{width:100%;max-height:360px;object-fit:contain;border-radius:14px;background:#eee}.saving{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.6}.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}@media(max-width:520px){h1{font-size:26px}.grid{grid-template-columns:1fr}.card{padding:15px}.drop{padding:22px 12px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><a class="home" href="../../">← ホームへ</a><span class="badge">画像ツール</span></div>
<h1>画像リサイズ＆圧縮</h1>
<p class="lead">写真を選び、横幅と画質を調整するだけ。処理はすべてこの端末内で行います。</p>
<section class="card">
<label class="drop">写真を選ぶ<small>JPEG / PNG / WebP に対応</small><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label>
<div id="preview" class="preview"><img id="previewImg" alt="選択画像"><div class="info"><span id="origSize" class="chip"></span><span id="origDim" class="chip"></span></div></div>
</section>
<section class="card">
<div class="grid">
<div class="field"><label for="width">出力する横幅</label><select id="width"><option value="0">元のサイズ</option><option value="1920">1920 px</option><option value="1280" selected>1280 px</option><option value="1080">1080 px</option><option value="800">800 px</option><option value="640">640 px</option></select></div>
<div class="field"><label for="format">形式</label><select id="format"><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select></div>
</div>
<div class="field"><div class="qualityRow"><label for="quality">画質</label><span id="qVal">82%</span></div><input id="quality" type="range" min="40" max="100" value="82"></div>
<button id="run" type="button">リサイズする</button>
<p class="note">縦横比は自動で維持します。PNGでは画質スライダーの影響はありません。</p>
</section>
<section id="result" class="card result"><canvas id="canvas"></canvas><div class="info"><span id="newSize" class="chip"></span><span id="newDim" class="chip"></span></div><a id="download" class="download" href="#">画像を保存</a><button id="reset" class="secondary" type="button">別の画像を選ぶ</button><p class="saving">iPhoneでは「画像を保存」を押したあと、表示された画像を長押しして写真へ保存できる場合があります。</p></section>
</main>
<script>
const file=document.getElementById('file'),preview=document.getElementById('preview'),previewImg=document.getElementById('previewImg'),origSize=document.getElementById('origSize'),origDim=document.getElementById('origDim'),widthSel=document.getElementById('width'),format=document.getElementById('format'),quality=document.getElementById('quality'),qVal=document.getElementById('qVal'),run=document.getElementById('run'),result=document.getElementById('result'),canvas=document.getElementById('canvas'),newSize=document.getElementById('newSize'),newDim=document.getElementById('newDim'),download=document.getElementById('download'),reset=document.getElementById('reset');
let img=new Image(),sourceFile=null,lastUrl='';
const bytes=n=>n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(2)} MB`;
quality.oninput=()=>qVal.textContent=quality.value+'%';
format.onchange=()=>{quality.disabled=format.value==='image/png';};
file.onchange=()=>{const f=file.files[0];if(!f)return;sourceFile=f;const url=URL.createObjectURL(f);img=new Image();img.onload=()=>{previewImg.src=url;origSize.textContent='元: '+bytes(f.size);origDim.textContent=`${img.naturalWidth} × ${img.naturalHeight}px`;preview.style.display='block';result.style.display='none';};img.src=url;};
run.onclick=()=>{if(!sourceFile||!img.naturalWidth){alert('先に写真を選んでください');return;}let targetW=Number(widthSel.value)||img.naturalWidth;if(targetW>img.naturalWidth)targetW=img.naturalWidth;const targetH=Math.round(img.naturalHeight*targetW/img.naturalWidth);canvas.width=targetW;canvas.height=targetH;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,targetW,targetH);const mime=format.value,q=Number(quality.value)/100;canvas.toBlob(blob=>{if(!blob){alert('変換できませんでした');return;}if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(blob);newSize.textContent='変換後: '+bytes(blob.size);newDim.textContent=`${targetW} × ${targetH}px`;const ext=mime==='image/png'?'png':mime==='image/webp'?'webp':'jpg';download.href=lastUrl;download.download=`resized-${Date.now()}.${ext}`;download.style.display='block';result.style.display='block';result.scrollIntoView({behavior:'smooth',block:'start'});},mime,mime==='image/png'?undefined:q);};
reset.onclick=()=>{file.value='';sourceFile=null;preview.style.display='none';result.style.display='none';window.scrollTo({top:0,behavior:'smooth'});};
</script></body></html>
