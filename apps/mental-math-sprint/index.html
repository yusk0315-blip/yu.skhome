<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123d30">
  <title>暗算スプリント｜60秒ミニゲーム</title>
  <meta name="description" content="60秒で暗算に何問答えられるか挑戦。難易度別ベストスコアを端末に保存できる無料ブラウザゲーム。">
  <style>
    :root{--bg:#f5f3ed;--card:#fffefa;--text:#17211d;--muted:#68726c;--line:rgba(23,33,29,.13);--accent:#176b4d;--accent2:#e4b767;--danger:#b64d42;--shadow:0 18px 44px rgba(23,33,29,.09)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100vh;font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--text);background:linear-gradient(180deg,#eef3ef,var(--bg));}
    button,input{font:inherit}
    button{touch-action:manipulation}
    .wrap{width:min(680px,100%);margin:0 auto;padding:18px 16px calc(36px + env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .back{color:var(--accent);font-weight:800;text-decoration:none;padding:10px 0}
    .badge{font-size:12px;font-weight:800;color:var(--accent);background:rgba(23,107,77,.09);padding:7px 10px;border-radius:999px}
    .hero{background:#123d30;color:#fff;border-radius:26px;padding:26px 22px;box-shadow:var(--shadow)}
    .eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800;color:var(--accent2)}
    h1{margin:10px 0 8px;font:700 clamp(30px,8vw,44px)/1.18 Georgia,"Yu Mincho",serif}
    .lead{margin:0;color:rgba(255,255,255,.75);line-height:1.8;font-size:14px}
    .scorebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
    .stat{padding:13px 8px;border:1px solid rgba(255,255,255,.14);border-radius:15px;text-align:center;background:rgba(255,255,255,.06)}
    .stat strong{display:block;font-size:23px;line-height:1.1}.stat span{display:block;margin-top:5px;font-size:10px;color:rgba(255,255,255,.62)}
    .panel{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(23,33,29,.055)}
    .panel h2{margin:0 0 12px;font:700 19px/1.4 Georgia,"Yu Mincho",serif}
    .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .level{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 7px;font-weight:800;color:var(--muted);cursor:pointer;min-height:48px}
    .level.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .best{margin:12px 0 0;color:var(--muted);font-size:13px;text-align:center}
    .game{display:none;text-align:center}
    .game.on{display:block}
    .question{min-height:94px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(42px,13vw,68px);letter-spacing:.02em}
    .answer{width:100%;border:2px solid var(--line);border-radius:18px;background:#fff;text-align:center;font-size:32px;font-weight:900;padding:14px;outline:none}
    .answer:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(23,107,77,.11)}
    .answer.ok{border-color:var(--accent)}.answer.ng{border-color:var(--danger)}
    .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
    .key{min-height:58px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 2px 0 rgba(23,33,29,.05)}
    .key:active{transform:translateY(1px)}
    .key.action{font-size:14px;color:var(--accent);background:#eef5f1}.key.enter{background:var(--accent);color:#fff;border-color:var(--accent)}
    .start{width:100%;margin-top:16px;border:0;border-radius:17px;background:var(--accent);color:#fff;min-height:56px;font-weight:900;font-size:16px;cursor:pointer}
    .note{margin:14px 2px 0;color:var(--muted);font-size:12px;line-height:1.7;text-align:center}
    .result{display:none;text-align:center}.result.on{display:block}
    .resultScore{font:700 58px/1 Georgia,serif;color:var(--accent);margin:10px 0 4px}.resultLabel{color:var(--muted);font-size:13px}
    .resultGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
    .rbox{padding:13px 6px;border-radius:14px;background:#f1f5f2}.rbox strong{display:block;font-size:20px}.rbox span{font-size:10px;color:var(--muted)}
    .secondary{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:17px;background:#fff;min-height:52px;font-weight:800;color:var(--accent);cursor:pointer}
    .hidden{display:none!important}
    @media(max-width:390px){.wrap{padding-left:12px;padding-right:12px}.hero{padding:22px 18px}.panel{padding:16px}.key{min-height:54px}.scorebar{gap:6px}.stat{padding-left:4px;padding-right:4px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><a class="back" href="../../">← ホームへ</a><span class="badge">GAME</span></div>
    <section class="hero">
      <div class="eyebrow">60 SECOND CHALLENGE</div>
      <h1>暗算スプリント</h1>
      <p class="lead">60秒で何問解ける？ 足し算・引き算・かけ算をテンポよく解く、短時間の暗算ゲームです。</p>
      <div class="scorebar">
        <div class="stat"><strong id="time">60</strong><span>残り秒</span></div>
        <div class="stat"><strong id="score">0</strong><span>正解</span></div>
        <div class="stat"><strong id="streak">0</strong><span>連続正解</span></div>
      </div>
    </section>

    <section class="panel" id="setup">
      <h2>難易度を選ぶ</h2>
      <div class="levels" role="group" aria-label="難易度">
        <button class="level active" data-level="easy">やさしい</button>
        <button class="level" data-level="normal">ふつう</button>
        <button class="level" data-level="hard">むずかしい</button>
      </div>
      <p class="best" id="bestText">ベスト：0問</p>
      <button class="start" id="startBtn">60秒スタート</button>
      <p class="note">途中でページを閉じてもベストスコアはこの端末に保存されます。通信は使いません。</p>
    </section>

    <section class="panel game" id="game" aria-live="polite">
      <div class="question" id="question">8 + 5</div>
      <input class="answer" id="answer" inputmode="numeric" pattern="-?[0-9]*" autocomplete="off" aria-label="答え" placeholder="答え">
      <div class="pad" aria-label="数字キー">
        <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
        <button class="key action" data-key="minus">−</button><button class="key" data-key="0">0</button><button class="key action" data-key="clear">消す</button>
        <button class="key enter" data-key="enter" style="grid-column:1/-1">決定</button>
      </div>
      <button class="secondary" id="quitBtn">終了する</button>
    </section>

    <section class="panel result" id="result">
      <h2>結果</h2>
      <div class="resultScore" id="resultScore">0</div>
      <div class="resultLabel">正解</div>
      <div class="resultGrid">
        <div class="rbox"><strong id="resultAccuracy">0%</strong><span>正答率</span></div>
        <div class="rbox"><strong id="resultBestStreak">0</strong><span>最大連続</span></div>
        <div class="rbox"><strong id="resultBest">0</strong><span>ベスト</span></div>
      </div>
      <button class="start" id="retryBtn">もう一回</button>
      <button class="secondary" id="changeBtn">難易度を変える</button>
    </section>
  </main>

  <script>
    (()=>{
      const $=s=>document.querySelector(s);
      const levels=[...document.querySelectorAll('.level')];
      const setup=$('#setup'),game=$('#game'),result=$('#result'),answer=$('#answer');
      const timeEl=$('#time'),scoreEl=$('#score'),streakEl=$('#streak'),questionEl=$('#question');
      let level='easy',target=0,timer=null,endAt=0,score=0,attempts=0,streak=0,bestStreak=0,running=false;
      const storeKey='mentalMathSprintBestV1';
      const getBests=()=>{try{return JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{return {}}};
      const saveBest=()=>{const b=getBests();if(score>(b[level]||0)){b[level]=score;localStorage.setItem(storeKey,JSON.stringify(b))}return b[level]||score};
      const updateBestText=()=>{$('#bestText').textContent=`ベスト：${getBests()[level]||0}問`};
      const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
      function makeQuestion(){
        let a,b,op;
        if(level==='easy'){
          op=Math.random()<.55?'+':'−'; a=rand(2,20); b=rand(1,15); if(op==='−'&&b>a)[a,b]=[b,a];
        }else if(level==='normal'){
          const r=Math.random(); op=r<.4?'+':r<.75?'−':'×';
          if(op==='×'){a=rand(2,12);b=rand(2,9)}else{a=rand(10,60);b=rand(5,45);if(op==='−'&&b>a)[a,b]=[b,a]}
        }else{
          const r=Math.random(); op=r<.34?'+':r<.67?'−':'×';
          if(op==='×'){a=rand(6,19);b=rand(3,14)}else{a=rand(35,180);b=rand(18,120)}
        }
        target=op==='+'?a+b:op==='−'?a-b:a*b;
        questionEl.textContent=`${a} ${op} ${b}`;
        answer.value='';answer.classList.remove('ok','ng');
      }
      function resetStats(){score=0;attempts=0;streak=0;bestStreak=0;scoreEl.textContent='0';streakEl.textContent='0';timeEl.textContent='60'}
      function start(){
        clearInterval(timer);resetStats();setup.classList.add('hidden');result.classList.remove('on');game.classList.add('on');running=true;endAt=Date.now()+60000;makeQuestion();answer.focus({preventScroll:true});
        timer=setInterval(tick,200);tick();
      }
      function tick(){const left=Math.max(0,Math.ceil((endAt-Date.now())/1000));timeEl.textContent=left;if(Date.now()>=endAt)finish()}
      function submit(){
        if(!running||answer.value.trim()===''||answer.value==='-')return;
        attempts++;const ok=Number(answer.value)===target;
        if(ok){score++;streak++;bestStreak=Math.max(bestStreak,streak);scoreEl.textContent=score;streakEl.textContent=streak;answer.classList.add('ok')}else{streak=0;streakEl.textContent='0';answer.classList.add('ng')}
        setTimeout(()=>{if(running)makeQuestion()},80);
      }
      function finish(){
        if(!running)return;running=false;clearInterval(timer);timeEl.textContent='0';game.classList.remove('on');result.classList.add('on');
        const best=saveBest();$('#resultScore').textContent=score;$('#resultAccuracy').textContent=attempts?`${Math.round(score/attempts*100)}%`:'0%';$('#resultBestStreak').textContent=bestStreak;$('#resultBest').textContent=best;
        if(navigator.vibrate)navigator.vibrate([80,50,80]);
      }
      levels.forEach(btn=>btn.addEventListener('click',()=>{levels.forEach(x=>x.classList.remove('active'));btn.classList.add('active');level=btn.dataset.level;updateBestText()}));
      $('#startBtn').addEventListener('click',start);$('#retryBtn').addEventListener('click',start);$('#quitBtn').addEventListener('click',finish);
      $('#changeBtn').addEventListener('click',()=>{result.classList.remove('on');setup.classList.remove('hidden');timeEl.textContent='60';scoreEl.textContent='0';streakEl.textContent='0';updateBestText()});
      answer.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}});
      document.querySelectorAll('[data-key]').forEach(btn=>btn.addEventListener('click',()=>{
        if(!running)return;const k=btn.dataset.key;
        if(k==='enter')submit();else if(k==='clear')answer.value=answer.value.slice(0,-1);else if(k==='minus'){answer.value=answer.value.startsWith('-')?answer.value.slice(1):'-'+answer.value}else if(answer.value.length<5)answer.value+=k;
        answer.focus({preventScroll:true});
      }));
      document.addEventListener('visibilitychange',()=>{if(running&&!document.hidden)tick()});
      updateBestText();
    })();
  </script>
</body>
</html>
