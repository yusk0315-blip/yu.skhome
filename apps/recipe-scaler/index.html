<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料理分量スケーラー</title><style>body{font-family:system-ui;margin:0;background:#f5f3ed;color:#17211d}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#fffefa;border:1px solid #ddd5c8;border-radius:20px;padding:18px;margin-top:14px}h1{font-size:26px;margin:0 0 8px}p{color:#68726c;line-height:1.7}.home{color:#176b4d;font-weight:800;text-decoration:none}label{display:block;font-weight:800;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px;box-sizing:border-box}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:999px;background:#176b4d;color:#fff;font-weight:800;font-size:16px}.result{font-size:28px;font-weight:900;margin-top:14px}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="home" href="../../">← ホームへ</a><section class="card"><h1>料理分量スケーラー</h1><p>レシピの「何人分」を変えたいとき、材料の量をすぐ換算できます。</p></section><section class="card"><div class="row"><div><label>元の人数</label><input id="from" type="number" min="0.1" step="0.1" value="2"></div><div><label>作りたい人数</label><input id="to" type="number" min="0.1" step="0.1" value="4"></div></div><label>元の材料量</label><input id="amount" type="number" min="0" step="any" placeholder="例：200"><label>単位</label><input id="unit" type="text" placeholder="例：g / ml / 個 / 大さじ"><button id="calc">換算する</button><div class="result" id="result">—</div><p>例：2人分で200g → 4人分なら400g</p></section></main><script>const f=document.getElementById('from'),t=document.getElementById('to'),a=document.getElementById('amount'),u=document.getElementById('unit'),r=document.getElementById('result');function calc(){const x=Number(f.value),y=Number(t.value),z=Number(a.value);if(!(x>0&&y>0&&z>=0)){r.textContent='入力を確認してください';return}const v=z*y/x;r.textContent=`${Number.isInteger(v)?v:Math.round(v*100)/100}${u.value?' '+u.value:''}`;}document.getElementById('calc').onclick=calc;[f,t,a,u].forEach(el=>el.addEventListener('input',()=>{if(a.value)calc()}));</script></body></html>
