<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MERGE SWIPE｜数字スワイプパズル</title>
<style>
:root{--bg:#f3f5ef;--card:#fff;--text:#17211d;--muted:#6c756f;--accent:#176b4d;--line:#dce2dc}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:linear-gradient(#f8faf6,#edf2ed);color:var(--text);min-height:100vh}.wrap{max-width:520px;margin:auto;padding:20px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:var(--accent);text-decoration:none;font-weight:800}.badge{font-size:12px;color:var(--muted)}h1{font-size:30px;margin:22px 0 6px}.lead{margin:0 0 18px;color:var(--muted);line-height:1.7}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:24px}.board{touch-action:none;user-select:none;background:#cbd5cc;border-radius:22px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;aspect-ratio:1;box-shadow:0 14px 34px #17312218}.cell{display:grid;place-items:center;border-radius:14px;background:#e9eee9;font-weight:900;font-size:clamp(20px,8vw,34px);transition:.12s}.n2{background:#f7f4e8}.n4{background:#ece7c8}.n8{background:#f3c785}.n16{background:#eda866}.n32{background:#e98768;color:#fff}.n64{background:#d96855;color:#fff}.n128{background:#d8bd5f;color:#fff;font-size:clamp(18px,7vw,30px)}.n256{background:#c8aa43;color:#fff;font-size:clamp(18px,7vw,30px)}.n512{background:#ad9131;color:#fff;font-size:clamp(18px,7vw,30px)}.n1024,.n2048,.n4096{background:#176b4d;color:#fff;font-size:clamp(15px,6vw,25px)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{min-height:50px;border:0;border-radius:14px;font:800 15px inherit;cursor:pointer}.primary{background:var(--accent);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.hint{text-align:center;color:var(--muted);font-size:13px;margin:14px 0}.keys{display:grid;grid-template-columns:repeat(3,52px);justify-content:center;gap:6px}.keys button{min-height:44px}.keys .up{grid-column:2}.msg{margin-top:14px;min-height:24px;text-align:center;font-weight:800;color:var(--accent)}
</style></head>
<body><main class="wrap"><div class="top"><a class="back" href="../../">← ホーム</a><span class="badge">スマホ対応・保存不要</span></div><h1>MERGE SWIPE</h1><p class="lead">同じ数字をスワイプで重ねるミニパズル。目標は4096。1プレイ数分で遊べます。</p><section class="stats"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div></section><div id="board" class="board" aria-label="4×4のゲーム盤"></div><div id="msg" class="msg"></div><div class="controls"><button id="new" class="primary">新しいゲーム</button><button id="undo" class="ghost">1手戻す</button></div><p class="hint">盤面を上下左右にスワイプ。PCは矢印キーでも操作できます。</p><div class="keys"><button class="ghost up" data-dir="up">↑</button><button class="ghost" data-dir="left">←</button><button class="ghost" data-dir="down">↓</button><button class="ghost" data-dir="right">→</button></div></main>
<script>
const N=4,b=document.getElementById('board'),sEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');let g=[],score=0,prev=null,best=Number(localStorage.getItem('mergeSwipeBest')||0);bestEl.textContent=best;
function empty(){return Array.from({length:N},()=>Array(N).fill(0))}function add(){let e=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g[r][c])e.push([r,c]);if(!e.length)return;let [r,c]=e[Math.floor(Math.random()*e.length)];g[r][c]=Math.random()<.9?2:4}
function start(){g=empty();score=0;prev=null;add();add();msg.textContent='';render()}function render(){b.innerHTML='';g.flat().forEach(v=>{let d=document.createElement('div');d.className='cell '+(v?'n'+Math.min(v,4096):'');d.textContent=v||'';b.appendChild(d)});sEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('mergeSwipeBest',best)}}
function pack(a){let x=a.filter(Boolean),out=[];for(let i=0;i<x.length;i++){if(x[i]===x[i+1]){let v=x[i]*2;out.push(v);score+=v;i++}else out.push(x[i])}while(out.length<N)out.push(0);return out}
function move(dir){prev={g:g.map(r=>[...r]),score};let old=JSON.stringify(g);if(dir==='left')g=g.map(pack);if(dir==='right')g=g.map(r=>pack([...r].reverse()).reverse());if(dir==='up'||dir==='down'){for(let c=0;c<N;c++){let col=[];for(let r=0;r<N;r++)col.push(g[r][c]);if(dir==='down')col.reverse();col=pack(col);if(dir==='down')col.reverse();for(let r=0;r<N;r++)g[r][c]=col[r]}}if(JSON.stringify(g)!==old){add();render();check()}else prev=null}
function canMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!g[r][c])return true;if(r+1<N&&g[r][c]===g[r+1][c])return true;if(c+1<N&&g[r][c]===g[r][c+1])return true}return false}function check(){if(g.flat().some(v=>v>=4096))msg.textContent='4096達成！さらに記録を伸ばせます 🎉';else if(!canMove())msg.textContent='ゲームオーバー。新しいゲームで再挑戦！'}
let sx=0,sy=0;b.addEventListener('touchstart',e=>{let t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});b.addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});document.addEventListener('keydown',e=>{let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(m[e.key]){e.preventDefault();move(m[e.key])}});document.querySelectorAll('[data-dir]').forEach(x=>x.onclick=()=>move(x.dataset.dir));document.getElementById('new').onclick=start;document.getElementById('undo').onclick=()=>{if(!prev)return;g=prev.g;score=prev.score;prev=null;msg.textContent='1手戻しました';render()};start();
</script></body></html>
