<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b4d">
  <title>おでかけ忘れ物チェッカー｜ゆーすけ無料アプリ集</title>
  <meta name="description" content="旅行・子連れ・仕事のおでかけ前に、持ち物をスマホで確認できる無料チェックリスト。登録不要で端末に保存できます。">
  <style>
    :root{--bg:#f5f3ed;--card:#fffefa;--text:#17211d;--muted:#68726c;--line:rgba(23,33,29,.14);--main:#176b4d;--sub:#d6923b;--danger:#b5483d;--shadow:0 18px 50px rgba(23,33,29,.10)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;color:var(--text);background:radial-gradient(circle at 8% 0%,rgba(214,146,59,.14),transparent 26rem),linear-gradient(180deg,#f8f6f0,var(--bg));min-height:100vh}
    button,input{font:inherit}.wrap{width:min(720px,100%);margin:auto;padding:18px 16px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.home{color:var(--main);text-decoration:none;font-weight:800}.badge{font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(23,107,77,.09);color:var(--main);font-weight:800}
    .hero,.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero{padding:24px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--main);font-weight:900}.hero h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(28px,8vw,42px);line-height:1.18;margin:10px 0}.hero p{color:var(--muted);line-height:1.8;margin:0}.progress{margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.bar{height:12px;background:#e8e6df;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--main),#3b9b76);transition:.25s}.progress strong{color:var(--main)}
    .panel{padding:18px;margin-top:14px}.templates{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;white-space:nowrap;font-weight:800;color:var(--muted)}.chip.active{background:var(--main);color:#fff;border-color:var(--main)}
    .add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}.add input{min-width:0;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.primary{border:0;border-radius:14px;padding:14px 16px;background:var(--main);color:#fff;font-weight:900}.secondary,.danger{border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:#fff;font-weight:800}.danger{color:var(--danger)}
    .list{display:grid;gap:9px;margin-top:14px}.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:15px;background:#fff}.item.done{opacity:.58}.item.done .name{text-decoration:line-through}.check{width:26px;height:26px;accent-color:var(--main)}.name{font-weight:750;overflow-wrap:anywhere}.remove{border:0;background:transparent;color:var(--muted);font-size:22px;padding:4px 7px}.empty{text-align:center;color:var(--muted);padding:28px 10px;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:12px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#17211d;color:#fff;padding:11px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:480px){.wrap{padding-inline:12px}.hero{padding:20px}.panel{padding:14px}.add{grid-template-columns:1fr}.primary{width:100%}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top"><a class="home" href="../../">← ホームへ戻る</a><span class="badge">登録不要・端末保存</span></div>
  <section class="hero">
    <div class="eyebrow">OUTING CHECKLIST</div>
    <h1>おでかけ忘れ物<br>チェッカー</h1>
    <p>旅行・子連れ・仕事の日に。持ち物を選び、出発前にタップで確認できます。</p>
    <div class="progress"><div class="bar"><i id="bar"></i></div><strong id="progressText">0 / 0</strong></div>
  </section>

  <section class="panel">
    <div class="templates" aria-label="テンプレート">
      <button class="chip active" data-template="daily">普段のおでかけ</button>
      <button class="chip" data-template="kids">子連れ</button>
      <button class="chip" data-template="travel">旅行</button>
      <button class="chip" data-template="work">仕事</button>
    </div>
    <form class="add" id="addForm">
      <input id="newItem" maxlength="40" placeholder="持ち物を追加（例：充電器）" aria-label="持ち物を追加">
      <button class="primary" type="submit">追加する</button>
    </form>
    <div class="list" id="list"></div>
    <div class="actions">
      <button class="secondary" id="copyBtn" type="button">一覧をコピー</button>
      <button class="secondary" id="resetChecks" type="button">チェックを戻す</button>
      <button class="danger" id="clearBtn" type="button">すべて削除</button>
    </div>
    <p class="note">入力内容とチェック状態は、この端末のブラウザに自動保存されます。通信は行いません。</p>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const templates={
 daily:['財布','スマートフォン','家の鍵','ハンカチ・ティッシュ','飲み物'],
 kids:['財布','スマートフォン','家の鍵','子どもの飲み物','おやつ','着替え','おむつ・おしりふき','タオル','保険証'],
 travel:['財布','スマートフォン','充電器','着替え','洗面用品','薬','予約・チケット確認','家の施錠確認'],
 work:['財布','スマートフォン','家の鍵','社員証','名刺','筆記用具','充電器','必要書類']
};
const KEY='odekake-check-v1';
let state=load()||{template:'daily',items:templates.daily.map(name=>({id:crypto.randomUUID(),name,done:false}))};
const list=document.getElementById('list'),bar=document.getElementById('bar'),progressText=document.getElementById('progressText'),toast=document.getElementById('toast');
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function say(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)}
function render(){
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.template===state.template));
 list.innerHTML='';
 if(!state.items.length){list.innerHTML='<div class="empty">持ち物はまだありません。<br>上の欄から追加してください。</div>'}
 state.items.forEach(item=>{
  const row=document.createElement('div');row.className='item'+(item.done?' done':'');
  row.innerHTML=`<input class="check" type="checkbox" ${item.done?'checked':''} aria-label="${escapeHtml(item.name)}を確認"><span class="name">${escapeHtml(item.name)}</span><button class="remove" type="button" aria-label="削除">×</button>`;
  row.querySelector('.check').addEventListener('change',e=>{item.done=e.target.checked;save();render();if(state.items.length&&state.items.every(x=>x.done))say('準備完了！いってらっしゃい');});
  row.querySelector('.remove').addEventListener('click',()=>{state.items=state.items.filter(x=>x.id!==item.id);save();render()});
  list.appendChild(row);
 });
 const done=state.items.filter(x=>x.done).length,total=state.items.length,pct=total?done/total*100:0;bar.style.width=pct+'%';progressText.textContent=`${done} / ${total}`;
}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{if(!confirm('現在の一覧を「'+btn.textContent+'」に入れ替えますか？'))return;state={template:btn.dataset.template,items:templates[btn.dataset.template].map(name=>({id:crypto.randomUUID(),name,done:false}))};save();render()}));
document.getElementById('addForm').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('newItem'),name=input.value.trim();if(!name)return;state.items.push({id:crypto.randomUUID(),name,done:false});input.value='';save();render();say('追加しました')});
document.getElementById('resetChecks').addEventListener('click',()=>{state.items.forEach(x=>x.done=false);save();render();say('チェックを戻しました')});
document.getElementById('clearBtn').addEventListener('click',()=>{if(confirm('持ち物をすべて削除しますか？')){state.items=[];save();render()}});
document.getElementById('copyBtn').addEventListener('click',async()=>{const text='【おでかけ持ち物】\n'+state.items.map(x=>`${x.done?'✓':'□'} ${x.name}`).join('\n');try{await navigator.clipboard.writeText(text);say('一覧をコピーしました')}catch{say('コピーできませんでした')}});
render();
</script>
</body>
</html>
