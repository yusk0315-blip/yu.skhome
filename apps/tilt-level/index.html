<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>傾斜角メーター｜ゆーすけ無料アプリ集</title>
<meta name="description" content="スマホの傾きを角度で確認できるシンプルな水平器。DIYや家具の設置確認に。">
<style>
:root{--bg:#f5f3ed;--card:#fffefa;--text:#17211d;--muted:#68726c;--line:rgba(23,33,29,.13);--accent:#176b4d;--accent2:#d6923b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:linear-gradient(180deg,var(--bg),#ebe7de);color:var(--text);min-height:100vh}.wrap{max-width:620px;margin:auto;padding:18px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:var(--accent);text-decoration:none;font-weight:800}.tag{font-size:12px;color:var(--muted)}h1{font-size:28px;margin:28px 0 8px}.lead{color:var(--muted);line-height:1.7;margin:0 0 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 18px 50px rgba(23,33,29,.09)}.meter{width:min(78vw,360px);aspect-ratio:1;margin:8px auto 18px;border:3px solid var(--text);border-radius:50%;position:relative;background:radial-gradient(circle at center,rgba(23,107,77,.07) 0 4px,transparent 5px),linear-gradient(90deg,transparent 49.7%,rgba(23,33,29,.13) 50%,transparent 50.3%),linear-gradient(0deg,transparent 49.7%,rgba(23,33,29,.13) 50%,transparent 50.3%);overflow:hidden}.bubble{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(214,146,59,.78);border:3px solid rgba(23,33,29,.55);left:calc(50% - 27px);top:calc(50% - 27px);transition:transform .08s linear}.readout{text-align:center}.angle{font-size:54px;font-weight:900;letter-spacing:-.04em}.status{font-weight:800;color:var(--accent);min-height:24px}.rows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.mini{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.mini b{display:block;font-size:22px}.mini span{font-size:12px;color:var(--muted)}button{width:100%;min-height:52px;border:0;border-radius:15px;font:inherit;font-weight:800;margin-top:12px;background:var(--accent);color:white}.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px}.ok{box-shadow:inset 0 0 0 8px rgba(23,107,77,.18)}@media(max-width:420px){h1{font-size:25px}.angle{font-size:48px}.card{padding:16px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><a class="back" href="../../">← ホームへ</a><span class="tag">DIY・センサー</span></div>
<h1>傾斜角メーター</h1>
<p class="lead">スマホを置くだけで傾きを確認。家具・棚・机などの水平チェックに使えます。</p>
<section class="card">
<div id="meter" class="meter"><div id="bubble" class="bubble"></div></div>
<div class="readout"><div id="angle" class="angle">--.-°</div><div id="status" class="status">センサーを開始してください</div></div>
<div class="rows"><div class="mini"><b id="x">--.-°</b><span>左右</span></div><div class="mini"><b id="y">--.-°</b><span>前後</span></div></div>
<button id="start">センサーを開始</button>
<button id="zero" class="secondary">この角度を 0° にする</button>
<button id="reset" class="secondary">補正をリセット</button>
<p class="note">端末によってセンサー精度は異なります。iPhoneでは最初に「センサーを開始」を押し、許可してください。精密な施工・安全判断には専用器具を使用してください。</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let ox=0,oy=0,lastX=0,lastY=0,started=false;
const norm=v=>Math.max(-45,Math.min(45,v));
function render(x,y){lastX=x;lastY=y;const cx=x-ox,cy=y-oy,mag=Math.hypot(cx,cy);$('x').textContent=cx.toFixed(1)+'°';$('y').textContent=cy.toFixed(1)+'°';$('angle').textContent=mag.toFixed(1)+'°';$('bubble').style.transform=`translate(${norm(cx)*2.6}px,${norm(cy)*2.6}px)`;const ok=mag<1;$('status').textContent=ok?'ほぼ水平です':'水平まであと '+mag.toFixed(1)+'°';$('meter').classList.toggle('ok',ok)}
function onOrientation(e){if(e.beta==null||e.gamma==null)return;render(e.gamma,e.beta)}
async function start(){try{if(typeof DeviceOrientationEvent==='undefined')throw new Error();if(typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw new Error()}window.addEventListener('deviceorientation',onOrientation,true);started=true;$('start').textContent='センサー動作中';$('status').textContent='スマホを傾けてください'}catch(e){$('status').textContent='この端末では傾きセンサーを利用できません'}}
$('start').addEventListener('click',start);$('zero').addEventListener('click',()=>{if(!started)return;$('status').textContent='現在の角度を0°にしました';ox=lastX;oy=lastY;render(lastX,lastY)});$('reset').addEventListener('click',()=>{ox=0;oy=0;if(started)render(lastX,lastY)});
</script>
</body></html>
