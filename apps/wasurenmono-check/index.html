<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>忘れ物チェックリスト｜出発前30秒</title>
<meta name="description" content="出勤・保育園・旅行などの持ち物を保存して、出発前に30秒で確認できる忘れ物チェックリスト。">
<style>
:root{--bg:#f5f3ed;--card:#fffefa;--text:#17211d;--muted:#68726c;--line:rgba(23,33,29,.13);--accent:#176b4d;--soft:#e7eee9}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:linear-gradient(180deg,var(--bg),#ece9e1);color:var(--text);min-height:100vh}.wrap{max-width:720px;margin:auto;padding:18px 16px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back{color:var(--accent);text-decoration:none;font-weight:800}.badge{font-size:12px;padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:800}.hero{background:#123d30;color:white;padding:24px;border-radius:24px;margin-bottom:16px}.hero h1{font-size:28px;margin:0 0 8px}.hero p{margin:0;color:rgba(255,255,255,.75);line-height:1.7}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.tab{border:1px solid var(--line);background:white;padding:10px 14px;border-radius:999px;white-space:nowrap;font-weight:800}.tab.active{background:var(--accent);color:white}.add{display:grid;grid-template-columns:1fr auto;gap:8px}.add input{min-height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font-size:16px}.btn{min-height:48px;border:0;border-radius:14px;padding:0 16px;font-weight:800;background:var(--accent);color:white}.mutedbtn{background:white;color:var(--text);border:1px solid var(--line)}.list{display:grid;gap:9px;margin-top:14px}.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:14px;background:white}.item.done{opacity:.55}.item input{width:24px;height:24px;accent-color:var(--accent)}.item span{font-size:16px}.del{border:0;background:transparent;font-size:20px;color:#8b5b5b}.progress{height:10px;background:#e7e4dc;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0;transition:.2s}.status{display:flex;justify-content:space-between;margin:10px 2px;color:var(--muted);font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.ready{display:none;margin-top:12px;padding:14px;border-radius:14px;background:#e8f3ed;color:#10563d;font-weight:900;text-align:center}.ready.show{display:block}@media(max-width:480px){.hero h1{font-size:24px}.card{padding:15px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<header><a class="back" href="../../">← ホーム</a><span class="badge">暮らし</span></header>
<section class="hero"><h1>忘れ物チェックリスト</h1><p>出発前30秒。いつもの持ち物を保存して、タップするだけで確認できます。</p></section>
<section class="card"><div class="tabs" id="tabs"></div></section>
<section class="card"><div class="add"><input id="newItem" placeholder="持ち物を追加（例：社員証）"><button class="btn" id="addBtn">追加</button></div><div class="list" id="list"></div></section>
<section class="card"><div class="progress"><i id="bar"></i></div><div class="status"><span id="count">0 / 0</span><span id="percent">0%</span></div><div class="actions"><button class="btn mutedbtn" id="resetBtn">チェックをリセット</button><button class="btn mutedbtn" id="presetBtn">初期項目に戻す</button></div><div class="ready" id="ready">準備OK！忘れ物チェック完了。</div></section>
</div>
<script>
const presets={"出勤":["財布","スマホ","鍵","社員証","イヤホン"],"保育園":["連絡帳","水筒","着替え","タオル","帽子"],"旅行":["財布","スマホ","充電器","身分証","薬","着替え"],"買い物":["財布","スマホ","エコバッグ","買い物メモ"]};
let category=localStorage.getItem('wc_cat')||'出勤';
let data=JSON.parse(localStorage.getItem('wc_data')||'null')||Object.fromEntries(Object.entries(presets).map(([k,v])=>[k,v.map(t=>({t,done:false}))]));
const $=s=>document.querySelector(s); function save(){localStorage.setItem('wc_cat',category);localStorage.setItem('wc_data',JSON.stringify(data));}
function renderTabs(){ $('#tabs').innerHTML=Object.keys(presets).map(k=>`<button class="tab ${k===category?'active':''}" data-k="${k}">${k}</button>`).join(''); document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{category=b.dataset.k;save();render();}); }
function renderList(){ const arr=data[category]||[]; $('#list').innerHTML=arr.length?arr.map((x,i)=>`<label class="item ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} data-i="${i}"><span>${x.t.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</span><button class="del" type="button" data-del="${i}" aria-label="削除">×</button></label>`).join(''):'<p style="color:var(--muted)">項目がありません。上から追加してください。</p>'; document.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{data[category][+c.dataset.i].done=c.checked;save();renderList();}); document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.preventDefault();data[category].splice(+b.dataset.del,1);save();renderList();}); const n=arr.length,d=arr.filter(x=>x.done).length,p=n?Math.round(d/n*100):0; $('#count').textContent=`${d} / ${n}`;$('#percent').textContent=`${p}%`;$('#bar').style.width=p+'%';$('#ready').classList.toggle('show',n>0&&d===n); }
function render(){renderTabs();renderList();}
$('#addBtn').onclick=()=>{const v=$('#newItem').value.trim();if(!v)return;(data[category]??=[]).push({t:v,done:false});$('#newItem').value='';save();renderList();};$('#newItem').addEventListener('keydown',e=>{if(e.key==='Enter')$('#addBtn').click()});
$('#resetBtn').onclick=()=>{(data[category]||[]).forEach(x=>x.done=false);save();renderList();};$('#presetBtn').onclick=()=>{data[category]=presets[category].map(t=>({t,done:false}));save();renderList();};render();
</script></body></html>
