<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#254536">
<title>付箋メモボード｜忘れたくないことをその場で保存</title>
<meta name="description" content="思いついたことを付箋感覚で残せるスマホ向けメモボード。内容は端末内に自動保存されます。">
<style>
:root{--bg:#f3f0e7;--card:#fffdfa;--ink:#18231d;--muted:#68726b;--line:#d9ddd8;--green:#254536;--accent:#d59a46;--danger:#a34242}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#edf1ec,#f3f0e7 38%);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}.wrap{width:min(720px,100%);margin:auto;padding:18px 14px calc(36px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.home{color:var(--green);text-decoration:none;font-weight:800;font-size:14px}.tag{font-size:11px;letter-spacing:.14em;color:#8b6a35;font-weight:800}.hero{padding:27px 20px;border-radius:24px;background:var(--green);color:#fff;box-shadow:0 18px 42px rgba(37,69,54,.18)}.hero h1{margin:7px 0 8px;font-size:clamp(28px,8vw,42px)}.hero p{margin:0;color:rgba(255,255,255,.76);font-size:14px;line-height:1.75}.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 28px rgba(24,35,29,.06)}textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;font:inherit;line-height:1.6;resize:vertical;outline:none}textarea:focus{border-color:#88aa99;box-shadow:0 0 0 3px rgba(37,69,54,.1)}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:10px}.primary,.secondary,.delete{min-height:48px;border-radius:14px;font:800 14px inherit}.primary{border:0;background:var(--green);color:#fff;padding:0 18px}.secondary{border:1px solid var(--line);background:#fff;color:var(--green);padding:0 14px}.board{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.note{position:relative;min-height:160px;padding:16px 14px 12px;border-radius:18px;background:#fff4b8;border:1px solid #eadb93;box-shadow:0 8px 18px rgba(60,52,22,.08);display:flex;flex-direction:column}.note:nth-child(3n+2){background:#e7f2e8;border-color:#c8dec9}.note:nth-child(3n){background:#e9eef9;border-color:#ccd7ef}.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;flex:1}.meta{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted)}.delete{min-height:36px;padding:0 11px;border:1px solid rgba(163,66,66,.25);background:rgba(255,255,255,.65);color:var(--danger)}.empty{grid-column:1/-1;text-align:center;padding:28px 10px;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.55)}.count{font-size:12px;color:var(--muted)}.noteinfo{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.7}@media(max-width:560px){.board{grid-template-columns:1fr}.row{grid-template-columns:1fr}.primary,.secondary{width:100%}}
</style></head>
<body><main class="wrap"><div class="top"><a class="home" href="../../">← ホームへ</a><span class="tag">YUSUKE DIGITAL STUDIO</span></div>
<section class="hero"><div class="tag">QUICK MEMO</div><h1>付箋メモボード</h1><p>思いついたことを、付箋みたいにすぐ保存。買うもの・電話すること・あとで調べることを1画面に残せます。</p></section>
<section class="card"><textarea id="input" maxlength="300" placeholder="メモを書く…"></textarea><div class="row"><span class="count"><span id="count">0</span>/300文字</span><button class="primary" id="add" type="button">付箋を追加</button></div></section>
<section class="board" id="board" aria-live="polite"></section>
<section class="card"><div class="row"><span class="count" id="savedCount">0件保存中</span><button class="secondary" id="clear" type="button">すべて削除</button></div><div class="noteinfo">※ メモはこの端末のブラウザ内だけに保存されます。重要なパスワードや個人情報の保管には使わないでください。</div></section></main>
<script>
(()=>{const KEY='yusuke_sticky_notes_v1',$=id=>document.getElementById(id);let notes=[];try{notes=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(notes))notes=[]}catch{notes=[]}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(notes));render()}function render(){$('savedCount').textContent=`${notes.length}件保存中`;if(!notes.length){$('board').innerHTML='<div class="empty">まだ付箋はありません。<br>上の欄から1つ追加してみてください。</div>';return}$('board').innerHTML=notes.map(n=>`<article class="note"><p>${esc(n.text)}</p><div class="meta"><span>${new Date(n.time).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span><button class="delete" data-id="${n.id}" type="button">削除</button></div></article>`).join('');document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{notes=notes.filter(n=>String(n.id)!==b.dataset.id);save()})}function add(){const text=$('input').value.trim();if(!text)return;notes.unshift({id:Date.now(),text,time:Date.now()});$('input').value='';$('count').textContent='0';save()}$('input').addEventListener('input',()=>$('count').textContent=$('input').value.length);$('add').onclick=add;$('input').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')add()});$('clear').onclick=()=>{if(notes.length&&confirm('すべての付箋を削除しますか？')){notes=[];save()}};render()})();
</script></body></html>
