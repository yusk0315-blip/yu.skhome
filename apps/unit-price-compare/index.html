<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>どっちがお得？単価比較</title>
<meta name="description" content="値段と内容量を入力して、2商品の単価をすぐ比較。100g・100ml・1個あたりでどちらがお得か分かります。">
<style>
:root{--bg:#f5f3ed;--card:#fffefa;--text:#17211d;--muted:#68726c;--line:rgba(23,33,29,.14);--accent:#176b4d;--accent2:#d6923b;--good:#e8f5ee;--shadow:0 18px 45px rgba(23,33,29,.09)}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:linear-gradient(180deg,#f8f6f0,#ece9e1);color:var(--text);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:18px 16px 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.back{color:var(--accent);text-decoration:none;font-weight:800}.badge{font-size:12px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(30px,8vw,46px);line-height:1.18;margin:8px 0 10px}.lead{color:var(--muted);line-height:1.8;margin:0 0 22px}.products{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card,.result{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.card h2{font-size:18px;margin:0 0 14px}.field{margin-top:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.row{display:grid;grid-template-columns:1fr 110px;gap:8px}input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:white;padding:10px 12px;font:inherit;color:var(--text)}input:focus,select:focus{outline:3px solid rgba(23,107,77,.14);border-color:var(--accent)}.unitPrice{margin-top:16px;padding:12px;border-radius:14px;background:#f5f7f3}.unitPrice b{display:block;font-size:22px;margin-top:4px}.result{margin-top:16px;text-align:center}.winner{font-size:24px;font-weight:900;margin:4px 0 8px}.saving{color:var(--accent);font-weight:800}.hint{color:var(--muted);font-size:13px;line-height:1.7}.actions{display:flex;gap:10px;margin-top:14px}.btn{flex:1;min-height:48px;border:0;border-radius:999px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--accent);color:white}.ghost{background:white;border:1px solid var(--line);color:var(--text)}.invalid{color:#b42318;font-weight:800}.footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center;line-height:1.7}@media(max-width:620px){.products{grid-template-columns:1fr}.wrap{padding-left:14px;padding-right:14px}.card,.result{padding:16px}.top{margin-bottom:14px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><a class="back" href="../../">← ホームへ</a><span class="badge">買い物ツール</span></div>
  <h1>どっちがお得？<br>単価比較</h1>
  <p class="lead">値札だけでは分かりにくい「本当に安い方」を、内容量込みで比較します。スーパーやドラッグストアでどうぞ。</p>
  <section class="products">
    <div class="card">
      <h2>商品A</h2>
      <div class="field"><label for="priceA">価格（税込）</label><div class="row"><input id="priceA" type="number" inputmode="decimal" min="0" step="1" value="298"><select aria-label="通貨"><option>円</option></select></div></div>
      <div class="field"><label for="amountA">内容量</label><div class="row"><input id="amountA" type="number" inputmode="decimal" min="0" step="any" value="450"><select id="unitA"><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">L</option><option value="pcs">個</option></select></div></div>
      <div class="unitPrice">基準単価<b id="unitPriceA">—</b></div>
    </div>
    <div class="card">
      <h2>商品B</h2>
      <div class="field"><label for="priceB">価格（税込）</label><div class="row"><input id="priceB" type="number" inputmode="decimal" min="0" step="1" value="398"><select aria-label="通貨"><option>円</option></select></div></div>
      <div class="field"><label for="amountB">内容量</label><div class="row"><input id="amountB" type="number" inputmode="decimal" min="0" step="any" value="700"><select id="unitB"><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">L</option><option value="pcs">個</option></select></div></div>
      <div class="unitPrice">基準単価<b id="unitPriceB">—</b></div>
    </div>
  </section>
  <section class="result" aria-live="polite">
    <div class="hint">比較結果</div>
    <div id="winner" class="winner">入力すると自動比較します</div>
    <div id="saving" class="saving"></div>
    <p id="detail" class="hint">重さ・容量・個数は、AとBで同じ種類を選んでください。</p>
    <div class="actions"><button id="swap" class="btn ghost" type="button">A / Bを入れ替え</button><button id="reset" class="btn primary" type="button">リセット</button></div>
  </section>
  <div class="footer">計算は端末内だけで行われます。価格表示やポイント還元などは店舗条件をご確認ください。</div>
</main>
<script>
const $=id=>document.getElementById(id);
const ids=['priceA','amountA','unitA','priceB','amountB','unitB'];
const family=u=>u==='g'||u==='kg'?'weight':u==='ml'||u==='l'?'volume':'count';
const baseAmount=(v,u)=>u==='kg'||u==='l'?v*1000:v;
const basis=u=>family(u)==='weight'?{n:100,label:'100g'}:family(u)==='volume'?{n:100,label:'100ml'}:{n:1,label:'1個'};
const yen=n=>Number.isFinite(n)?`${n.toFixed(n<10?2:1)}円`:'—';
function save(){const s={};ids.forEach(id=>s[id]=$(id).value);localStorage.setItem('unitPriceCompare',JSON.stringify(s));}
function calc(){
 const pa=+$('priceA').value, pb=+$('priceB').value, aa=+$('amountA').value, ab=+$('amountB').value, ua=$('unitA').value, ub=$('unitB').value;
 if(!pa||!pb||!aa||!ab){$('unitPriceA').textContent='—';$('unitPriceB').textContent='—';$('winner').textContent='価格と内容量を入力してください';$('saving').textContent='';$('detail').textContent='0より大きい数字を入力してください。';save();return;}
 if(family(ua)!==family(ub)){$('unitPriceA').textContent='—';$('unitPriceB').textContent='—';$('winner').innerHTML='<span class="invalid">単位の種類が違います</span>';$('saving').textContent='';$('detail').textContent='gとkg、mlとLは比較できます。重さと容量、個数は相互比較できません。';save();return;}
 const ba=basis(ua), ra=pa/baseAmount(aa,ua)*ba.n, rb=pb/baseAmount(ab,ub)*ba.n;
 $('unitPriceA').textContent=`${yen(ra)} / ${ba.label}`;$('unitPriceB').textContent=`${yen(rb)} / ${ba.label}`;
 const diff=Math.abs(ra-rb), pct=diff/Math.max(ra,rb)*100;
 if(Math.abs(ra-rb)<0.000001){$('winner').textContent='ほぼ同じ単価です';$('saving').textContent='';$('detail').textContent=`どちらも ${yen(ra)} / ${ba.label}`;}
 else {const win=ra<rb?'A':'B',cheap=Math.min(ra,rb),high=Math.max(ra,rb);$('winner').textContent=`商品${win}がお得`; $('saving').textContent=`約${pct.toFixed(1)}% 安い`; $('detail').textContent=`${ba.label}あたり約${(high-cheap).toFixed(1)}円の差です。`;}
 save();
}
ids.forEach(id=>$(id).addEventListener('input',calc));
$('swap').addEventListener('click',()=>{[['priceA','priceB'],['amountA','amountB'],['unitA','unitB']].forEach(([a,b])=>{const t=$(a).value;$(a).value=$(b).value;$(b).value=t});calc();});
$('reset').addEventListener('click',()=>{localStorage.removeItem('unitPriceCompare');$('priceA').value=298;$('amountA').value=450;$('unitA').value='g';$('priceB').value=398;$('amountB').value=700;$('unitB').value='g';calc();});
try{const s=JSON.parse(localStorage.getItem('unitPriceCompare'));if(s) ids.forEach(id=>{if(s[id]!=null)$(id).value=s[id]});}catch(e){}
calc();
</script>
</body>
</html>
