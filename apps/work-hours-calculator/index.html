<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>勤務時間・残業計算</title>
<meta name="description" content="出勤・退勤・休憩を入力して、実働時間と残業時間をすぐ計算。登録不要・ブラウザ内で完結。">
<style>
:root{--bg:#f5f3ed;--card:#fffefa;--text:#17211d;--muted:#68726c;--line:rgba(23,33,29,.13);--accent:#176b4d;--accent2:#d6923b;--danger:#b45309;--shadow:0 18px 50px rgba(23,33,29,.09)}
*{box-sizing:border-box}html{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--text);background:var(--bg)}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(214,146,59,.12),transparent 28rem),linear-gradient(180deg,#f5f3ed,#eeebe3);min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:18px 16px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.back{color:var(--accent);text-decoration:none;font-weight:800}.badge{font-size:12px;padding:6px 10px;border-radius:999px;background:#e7eee9;color:var(--accent);font-weight:800}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.hero{padding:24px;margin-bottom:14px}.hero h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(28px,7vw,42px);margin:0 0 10px}.hero p{margin:0;color:var(--muted);line-height:1.8}.card{padding:18px;margin-top:14px;box-shadow:0 10px 28px rgba(23,33,29,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:800;margin:0 0 7px}.field input{width:100%;min-height:52px;border:1px solid var(--line);border-radius:14px;padding:0 13px;font:inherit;background:#fff;color:var(--text)}.field input:focus{outline:3px solid rgba(23,107,77,.14);border-color:var(--accent)}
.preset{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.preset button,.actions button{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:44px;padding:0 14px;font:700 14px inherit;color:var(--text)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result{padding:14px;border-radius:16px;background:#f1f5f2;text-align:center}.result small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.result strong{font-size:22px}.result.overtime{background:#fff3df}.result.overtime strong{color:var(--danger)}
.note{font-size:12px;line-height:1.7;color:var(--muted);margin:12px 0 0}.error{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;background:#fff1ed;color:#9a3412;font-size:13px}.summary{margin-top:12px;padding:13px;border-radius:14px;background:#f7f5ef;line-height:1.7}.summary b{color:var(--accent)}
@media(max-width:540px){.wrap{padding:14px 12px 40px}.hero{padding:20px}.grid{grid-template-columns:1fr 1fr}.results{grid-template-columns:1fr}.result{display:flex;align-items:center;justify-content:space-between;text-align:left}.result small{margin:0}.actions{grid-template-columns:1fr}.field input{font-size:16px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><a class="back" href="../../">← ホームへ</a><span class="badge">仕事・時間</span></div>
  <section class="hero"><h1>勤務時間・残業計算</h1><p>出勤・退勤・休憩を入れるだけ。実働時間と、所定労働時間を超えた時間をすぐ確認できます。</p></section>
  <section class="card">
    <div class="grid">
      <div class="field"><label for="start">出勤</label><input id="start" type="time" value="09:00"></div>
      <div class="field"><label for="end">退勤</label><input id="end" type="time" value="18:00"></div>
      <div class="field"><label for="breakMin">休憩（分）</label><input id="breakMin" type="number" inputmode="numeric" min="0" max="600" step="5" value="60"></div>
      <div class="field"><label for="regular">所定労働（時間）</label><input id="regular" type="number" inputmode="decimal" min="0" max="24" step="0.25" value="8"></div>
    </div>
    <div class="preset"><button type="button" data-preset="8">8時間勤務</button><button type="button" data-preset="7.5">7.5時間勤務</button><button type="button" id="overnight">日またぎ例</button></div>
    <div class="actions"><button class="primary" id="calc" type="button">計算する</button><button id="reset" type="button">初期値に戻す</button></div>
    <div class="error" id="error"></div>
  </section>
  <section class="card" aria-live="polite">
    <div class="results">
      <div class="result"><small>拘束時間</small><strong id="span">9時間00分</strong></div>
      <div class="result"><small>実働時間</small><strong id="worked">8時間00分</strong></div>
      <div class="result overtime"><small>所定超過</small><strong id="overtimeValue">0時間00分</strong></div>
    </div>
    <div class="summary" id="summary">9:00〜18:00、休憩60分 → <b>実働8時間00分</b></div>
    <p class="note">※「所定超過」は入力した所定労働時間との差です。法定時間外労働や割増賃金の判定そのものではありません。日をまたぐ勤務にも対応します。</p>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const els={start:$('start'),end:$('end'),breakMin:$('breakMin'),regular:$('regular'),span:$('span'),worked:$('worked'),ot:$('overtimeValue'),summary:$('summary'),error:$('error')};
function mins(t){if(!/^\d{2}:\d{2}$/.test(t))return NaN;const [h,m]=t.split(':').map(Number);return h*60+m}
function fmt(total){total=Math.max(0,Math.round(total));return `${Math.floor(total/60)}時間${String(total%60).padStart(2,'0')}分`}
function calculate(){
  els.error.style.display='none';
  let s=mins(els.start.value),e=mins(els.end.value),br=Number(els.breakMin.value),reg=Number(els.regular.value)*60;
  if([s,e,br,reg].some(Number.isNaN)||br<0||reg<0){els.error.textContent='入力内容を確認してください。';els.error.style.display='block';return}
  if(e<=s)e+=1440;
  const span=e-s;
  if(br>span){els.error.textContent='休憩時間が拘束時間を超えています。';els.error.style.display='block';return}
  const work=span-br,ot=Math.max(0,work-reg);
  els.span.textContent=fmt(span);els.worked.textContent=fmt(work);els.ot.textContent=fmt(ot);
  els.summary.innerHTML=`${els.start.value}〜${els.end.value}${e>=1440?'（翌日）':''}、休憩${br}分 → <b>実働${fmt(work)}</b>${ot>0?`・所定超過${fmt(ot)}`:''}`;
  localStorage.setItem('workHoursCalc',JSON.stringify({start:els.start.value,end:els.end.value,breakMin:br,regular:Number(els.regular.value)}));
}
function restore(){try{const v=JSON.parse(localStorage.getItem('workHoursCalc'));if(v){els.start.value=v.start||'09:00';els.end.value=v.end||'18:00';els.breakMin.value=v.breakMin??60;els.regular.value=v.regular??8}}catch(e){}calculate()}
$('calc').addEventListener('click',calculate);['start','end','breakMin','regular'].forEach(id=>$(id).addEventListener('input',calculate));
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{els.regular.value=b.dataset.preset;calculate()}));
$('overnight').addEventListener('click',()=>{els.start.value='22:00';els.end.value='07:00';els.breakMin.value=60;els.regular.value=8;calculate()});
$('reset').addEventListener('click',()=>{els.start.value='09:00';els.end.value='18:00';els.breakMin.value=60;els.regular.value=8;calculate()});
restore();
</script>
</body>
</html>
