<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123d30">
  <title>配色コントラストチェッカー｜ゆーすけ無料アプリ集</title>
  <meta name="description" content="文字色と背景色を選ぶだけで、コントラスト比と読みやすさの目安を確認できる無料ツール。">
  <style>
    :root{--bg:#f5f3ed;--card:#fffefa;--text:#17211d;--muted:#68726c;--line:rgba(23,33,29,.14);--accent:#176b4d;--good:#176b4d;--bad:#9b342b;--radius:20px}
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:linear-gradient(180deg,#f5f3ed,#ece9e1);color:var(--text);min-height:100vh}
    button,input{font:inherit}
    .wrap{max-width:760px;margin:0 auto;padding:18px 16px 44px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
    .home{color:var(--accent);font-weight:800;text-decoration:none;padding:10px 12px;border-radius:999px;background:#fff;border:1px solid var(--line)}
    .badge{font-size:12px;color:var(--muted)}
    header{padding:20px 4px 8px}
    h1{margin:0 0 10px;font:700 clamp(28px,7vw,42px)/1.25 Georgia,"Yu Mincho",serif}
    .lead{margin:0;color:var(--muted);line-height:1.8}
    .card{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 14px 38px rgba(23,33,29,.07)}
    .controls{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
    label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}
    .colorRow{display:grid;grid-template-columns:54px 1fr;gap:8px}
    input[type=color]{width:54px;height:50px;padding:3px;border:1px solid var(--line);border-radius:12px;background:#fff}
    input[type=text]{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 12px;text-transform:uppercase;background:#fff;color:var(--text)}
    input:focus,button:focus-visible,a:focus-visible{outline:3px solid rgba(23,107,77,.2);outline-offset:2px}
    .swap{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--accent);font-size:20px;font-weight:900;cursor:pointer}
    .preview{min-height:190px;border-radius:18px;padding:24px;display:flex;flex-direction:column;justify-content:center;transition:.2s ease}
    .preview strong{font-size:clamp(24px,6vw,38px);line-height:1.35}
    .preview p{margin:9px 0 0;line-height:1.8;font-size:15px}
    .ratio{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 0 12px}
    .ratioNum{font:700 clamp(44px,13vw,68px)/1 Georgia,serif}
    .ratioNum small{font:700 17px/1 ui-sans-serif,system-ui,sans-serif;color:var(--muted)}
    .status{font-weight:900;padding:8px 11px;border-radius:999px;background:#eef5f1;color:var(--good)}
    .status.bad{background:#f8ecea;color:var(--bad)}
    .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .check{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
    .check b{display:block;font-size:13px;margin-bottom:5px}
    .check span{font-size:12px;color:var(--muted)}
    .pass{color:var(--good)!important;font-weight:900}.fail{color:var(--bad)!important;font-weight:900}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    button.action{min-height:48px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--accent);font-weight:800;cursor:pointer}
    button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .note{font-size:12px;line-height:1.75;color:var(--muted);margin:14px 2px 0}
    .history{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;cursor:pointer;font-size:12px}
    @media(max-width:560px){.controls{grid-template-columns:1fr}.swap{justify-self:center;transform:rotate(90deg)}.checks{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.preview{min-height:170px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><a class="home" href="../../">← ホームへ</a><span class="badge">登録・通信不要</span></div>
    <header>
      <h1>配色コントラスト<br>チェッカー</h1>
      <p class="lead">文字色と背景色を選ぶだけ。コントラスト比と、通常文字・大きな文字の読みやすさをすぐ確認できます。</p>
    </header>

    <section class="card" aria-label="色の設定">
      <div class="controls">
        <div>
          <label for="textHex">文字色</label>
          <div class="colorRow"><input id="textColor" type="color" value="#17211d" aria-label="文字色を選ぶ"><input id="textHex" type="text" value="#17211D" maxlength="7" inputmode="text" aria-label="文字色の16進数"></div>
        </div>
        <button class="swap" id="swap" type="button" aria-label="文字色と背景色を入れ替える">⇄</button>
        <div>
          <label for="bgHex">背景色</label>
          <div class="colorRow"><input id="bgColor" type="color" value="#fffefa" aria-label="背景色を選ぶ"><input id="bgHex" type="text" value="#FFFEFA" maxlength="7" inputmode="text" aria-label="背景色の16進数"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="preview" id="preview">
        <strong>この文字、読みやすい？</strong>
        <p>実際の配色で文章を表示します。小さな文字でも無理なく読めるか確認してみてください。</p>
      </div>
      <div class="ratio">
        <div class="ratioNum" id="ratio">-- <small>: 1</small></div>
        <div class="status" id="status">判定中</div>
      </div>
      <div class="checks">
        <div class="check"><b>通常文字 AA</b><span id="aaNormal">4.5:1 以上</span></div>
        <div class="check"><b>大きな文字 AA</b><span id="aaLarge">3:1 以上</span></div>
        <div class="check"><b>通常文字 AAA</b><span id="aaaNormal">7:1 以上</span></div>
      </div>
      <div class="actions">
        <button class="action primary" id="save" type="button">この配色を保存</button>
        <button class="action" id="copy" type="button">結果をコピー</button>
      </div>
      <p class="note">AA/AAAはWCAGのコントラスト基準を目安にした表示です。大きな文字は概ね18pt以上、または太字14pt以上が目安です。</p>
    </section>

    <section class="card" id="historyCard" hidden>
      <b>保存した配色</b>
      <div class="history" id="history"></div>
    </section>
  </main>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const el={tc:$('textColor'),th:$('textHex'),bc:$('bgColor'),bh:$('bgHex'),preview:$('preview'),ratio:$('ratio'),status:$('status'),aaN:$('aaNormal'),aaL:$('aaLarge'),aaaN:$('aaaNormal'),history:$('history'),historyCard:$('historyCard')};
  const KEY='colorContrastSavedV1';
  const normalize=v=>{v=v.trim().toUpperCase();if(!v.startsWith('#'))v='#'+v;return /^#[0-9A-F]{6}$/.test(v)?v:null};
  const rgb=hex=>[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
  const lum=hex=>{const c=rgb(hex).map(v=>v/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]};
  const contrast=(a,b)=>{const l1=lum(a),l2=lum(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)};
  function mark(node,pass,label){node.textContent=(pass?'✓ ':'× ')+label;node.className=pass?'pass':'fail'}
  function update(){
    const t=normalize(el.th.value)||el.tc.value.toUpperCase();
    const b=normalize(el.bh.value)||el.bc.value.toUpperCase();
    if(normalize(el.th.value)){el.tc.value=t;el.th.value=t}
    if(normalize(el.bh.value)){el.bc.value=b;el.bh.value=b}
    el.preview.style.color=t;el.preview.style.background=b;
    const r=contrast(t,b);el.ratio.innerHTML=r.toFixed(2)+' <small>: 1</small>';
    mark(el.aaN,r>=4.5,'4.5:1 以上');mark(el.aaL,r>=3,'3:1 以上');mark(el.aaaN,r>=7,'7:1 以上');
    const good=r>=4.5;el.status.textContent=good?'通常文字も読みやすい':'通常文字は要改善';el.status.className='status'+(good?'':' bad');
  }
  function bind(color,hex){color.addEventListener('input',()=>{hex.value=color.value.toUpperCase();update()});hex.addEventListener('input',update);hex.addEventListener('blur',()=>{const n=normalize(hex.value);if(n){hex.value=n;color.value=n}else hex.value=color.value.toUpperCase();update()})}
  bind(el.tc,el.th);bind(el.bc,el.bh);
  $('swap').addEventListener('click',()=>{const t=el.th.value;el.th.value=el.bh.value;el.bh.value=t;el.tc.value=el.th.value;el.bc.value=el.bh.value;update()});
  function getSaved(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
  function renderSaved(){const list=getSaved();el.historyCard.hidden=!list.length;el.history.innerHTML='';list.forEach((p,i)=>{const btn=document.createElement('button');btn.className='chip';btn.type='button';btn.textContent=p.t+' / '+p.b;btn.style.borderLeft='12px solid '+p.t;btn.style.borderRight='12px solid '+p.b;btn.onclick=()=>{el.th.value=p.t;el.bh.value=p.b;el.tc.value=p.t;el.bc.value=p.b;update()};el.history.appendChild(btn)})}
  $('save').addEventListener('click',()=>{const p={t:normalize(el.th.value)||el.tc.value.toUpperCase(),b:normalize(el.bh.value)||el.bc.value.toUpperCase()};let list=getSaved().filter(x=>x.t!==p.t||x.b!==p.b);list.unshift(p);list=list.slice(0,6);localStorage.setItem(KEY,JSON.stringify(list));renderSaved();$('save').textContent='保存しました';setTimeout(()=>$('save').textContent='この配色を保存',1200)});
  $('copy').addEventListener('click',async()=>{const t=normalize(el.th.value)||el.tc.value.toUpperCase(),b=normalize(el.bh.value)||el.bc.value.toUpperCase(),r=contrast(t,b);const text=`文字色 ${t} / 背景色 ${b} / コントラスト比 ${r.toFixed(2)}:1 / 通常文字AA ${r>=4.5?'合格':'未達'}`;try{await navigator.clipboard.writeText(text);$('copy').textContent='コピーしました'}catch{$('copy').textContent='コピーできませんでした'}setTimeout(()=>$('copy').textContent='結果をコピー',1200)});
  update();renderSaved();
})();
</script>
</body>
</html>
